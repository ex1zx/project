name: Build PROJECT APK

on:
  workflow_dispatch:
  push:
    paths:
      - "native-android/**"
      - ".github/workflows/build-project-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Download bundled hand model
        run: bash scripts/fetch-model.sh
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-release-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk